<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 372" role="img" aria-label="Anatomía del símbolo de soldadura según ISO 2553 y AWS A2.4 (esquema)"><title>Anatomía del símbolo de soldadura según ISO 2553 y AWS A2.4 (esquema)</title><rect width="440" height="372" fill="#ffffff"/><text x="210" y="20" font-size="15" text-anchor="middle" fill="#14213d" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif">ISO 2553</text><line x1="60" x2="300" y1="84" y2="84" stroke="#14213d" stroke-width="2"/><line x1="60" x2="300" y1="91" y2="91" stroke="#14213d" stroke-width="1.6" stroke-dasharray="7 4"/><line x1="60" y1="84" x2="24" y2="130" stroke="#14213d" stroke-width="2"/><path d="M24,130 L36,123 L29,117 Z" fill="#14213d"/><path d="M130,84 L130,62 L152,84 Z" fill="none" stroke="#14213d" stroke-width="2"/><text x="160" y="74" font-size="14" text-anchor="start" fill="#14213d" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif">a5</text><path d="M300,84 L318,70 M300,84 L318,98" stroke="#14213d" stroke-width="2" fill="none"/><text x="326" y="88" font-size="13" text-anchor="start" fill="#14213d" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif">111</text><text x="100" y="52" font-size="11" text-anchor="start" fill="#0b6fa4" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif">símbolo + dimensión (a = garganta, z = cateto)</text><text x="318" y="112" font-size="11" text-anchor="middle" fill="#0b6fa4" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif">cola: proceso (ISO 4063)</text><text x="20" y="150" font-size="11" text-anchor="start" fill="#0b6fa4" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif">Línea continua = lado de la flecha; discontinua = lado opuesto.</text><text x="66" y="122" font-size="11" text-anchor="start" fill="#46546e" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif">línea de flecha</text><g transform="translate(0,176)"><text x="