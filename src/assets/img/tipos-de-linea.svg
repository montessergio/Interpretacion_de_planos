<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 232" role="img" aria-label="Tipos de línea usados en dibujo técnico"><title>Tipos de línea usados en dibujo técnico</title><rect width="520" height="232" fill="#ffffff"/><line x1="14" x2="190" y1="28" y2="28" stroke="#14213d" stroke-width="3.0"/><text x="204" y="25" font-size="12" text-anchor="start" fill="#14213d" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif">Continua gruesa</text><text x="204" y="39" font-size="11" text-anchor="start" fill="#46546e" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif">Contornos y aristas visibles</text><line x1="14" x2="190" y1="62" y2="62" stroke="#14213d" stroke-width="1.2"/><text x="204" y="59" font-size="12" text-anchor="start" fill="#14213d" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif">Continua fina</text><text x="204" y="73" font-size="11" text-anchor="start" fill="#46546e" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif">Cotas, líneas de proyección, rayado</text><line x1="14" x2="190" y1="96" y2="96" stroke="#14213d" stroke-width="1.2" stroke-dasharray="8 4"/><text x="204" y="93" font-size="12" text-anchor="start" fill="#14213d" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif">Discontinua fina</text><text x="204" y="107" font-size="11" text-anchor="start" fill="#46546e" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif">Aristas y contornos ocultos</text><line x1="14" x2="190" y1="130" y2="130" stroke="#14213d" stroke-width="1.2" stroke-dasharray="16 3 3 3"/><text x="204" y="127" font-size="12" text-anchor="start" fill="#14213d" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif">Trazo y punto fina</text><text x="204" y="141" font-size="11" text-anchor="start" fill="#46546e" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif">Ejes, centros y simetría</text><line x1="14" x2="190" y1="164" y2="164" stroke="#14213d" stroke-width="1.2" stroke-dasharray="16 3 3 3"/><line x1="14" x2="34" y1="164" y2="164" stroke="#14213d" stroke-width="3"/><line x1="170" x2="190" y1="164" y2="164" stroke="#14213d" stroke-width="3"/><text x="204" y="161" font-size="12" text-anchor="start" fill="#14213d" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif">Trazo y punto, gruesa en extremos</text><text x="204" y="175" font-size="11" text-anchor="start" fill="#46546e" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif">Planos de corte</text><line x1="14" x2="190" y1="198" y2="198" stroke="#14213d" stroke-width="1.2" stroke-dasharray="16 3 3 3 3 3"/><text x="204" y="195" font-size="12" text-anchor="start" fill="#14213d" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif">Trazo y dos puntos fina</text><text x="204" y="209" font-size="11" text-anchor="start" fill="#46546e" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif">Piezas adyacentes, posiciones extremas</text></svg>