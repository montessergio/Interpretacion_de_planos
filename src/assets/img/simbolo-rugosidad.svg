<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 146" role="img" aria-label="Símbolos básicos de textura superficial (esquema)"><title>Símbolos básicos de textura superficial (esquema)</title><rect width="470" height="146" fill="#ffffff"/><g transform="translate(40,70)" fill="none" stroke="#14213d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M-14,-12 L0,12 L30,-40 L70,-40"/></g><g transform="translate(200,70)" fill="none" stroke="#14213d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M-14,-12 L0,12 L30,-40 L70,-40"/><path d="M-14,-12 L19,-12"/></g><g transform="translate(360,70)" fill="none" stroke="#14213d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M-14,-12 L0,12 L30,-40 L70,-40"/><circle cx="10" cy="-14" r="9"/></g><text x="65" y="112" font-size="12" text-anchor="middle" fill="#14213d" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif">Símbolo básico</text><text x="65" y="128" font-size="10" text-anchor="middle" fill="#46546e" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif">no dice si se maquina</text><text x="225" y="112" font-size="12" text-anchor="middle" fill="#14213d" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif">Con remoción de material</text><text x="225" y="128" font-size="10" text-anchor="middle" fill="#46546e" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif">se exige mecanizado</text><text x="385" y="112" font-size="12" text-anchor="middle" fill="#14213d" font-weight="bold" font-family="system-ui,Segoe UI,Arial,sans-serif">Sin remoción de material</text><text x="385" y="128" font-size="10" text-anchor="middle" fill="#46546e" font-weight="normal" font-family="system-ui,Segoe UI,Arial,sans-serif">superficie tal cual (colada, forja…)</text></svg>